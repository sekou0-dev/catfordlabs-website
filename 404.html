<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — Catford Labs</title>
    <meta name="theme-color" content="#0D7A85" />
    <script>
      (function () {
        var host = location.hostname;
        if (host !== "catfordlabs.com" && host !== "www.catfordlabs.com") return;
        if (location.protocol === "https:" && host === "www.catfordlabs.com")
          return;
        location.replace(
          "https://www.catfordlabs.com" +
            location.pathname +
            location.search +
            location.hash
        );
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/assets/fonts/nunito-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/fonts/barlow-condensed-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/styles.css?v=5" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Catford Labs home">
        <img
          class="brand-logo"
          src="/assets/catford-labs-logo.png"
          alt="Catford Labs"
          width="575"
          height="599"
        />
      </a>
    </header>
    <main class="hero missing">
      <div class="hero-copy">
        <p class="eyebrow">404</p>
        <h1>Wrong level.</h1>
        <p class="hero-lede">This page wandered off the map.</p>
        <a class="button" href="/">Back to Catford Labs</a>
      </div>
    </main>
  </body>
</html>
